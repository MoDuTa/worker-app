name: Discord merge notifications
on:
  pull_request_target:
    types: [closed]
permissions: {}
jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify merged PR
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_MERGE_WEBHOOK }}
        shell: python
        run: |
          import json, os, urllib.request
          from urllib.parse import urlparse
          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as f:
              event = json.load(f)
          pr = event['pull_request']
          if pr.get('merged') is not True:
              raise SystemExit(0)
          url = os.environ.get('DISCORD_WEBHOOK', '')
          parsed = urlparse(url)
          if parsed.scheme != 'https' or parsed.hostname != 'discord.com' or not parsed.path.startswith('/api/webhooks/'):
              raise SystemExit('Missing or invalid DISCORD_MERGE_WEBHOOK secret')
          repo = event['repository']['full_name']
          title = pr['title'][:200]
          payload = {
              'allowed_mentions': {'parse': []},
              'embeds': [{
                  'title': f'{repo} PR #{pr["number"]} merged'[:256],
                  'url': pr['html_url'],
                  'description': title,
                  'color': 8950271,
                  'fields': [
                      {'name': 'Branch', 'value': f'{pr["head"]["ref"]} → {pr["base"]["ref"]}'[:1024]},
                      {'name': 'Merged by', 'value': (pr.get('merged_by') or {}).get('login', 'unknown')}
                  ],
                  'timestamp': pr['merged_at']
              }]
          }
          request = urllib.request.Request(url, data=json.dumps(payload).encode(), headers={
              'Content-Type': 'application/json', 'User-Agent': 'MoDuTa-GitHub-Notifications'
          }, method='POST')
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(f'Discord notification delivered: HTTP {response.status}')
          except Exception:
              raise SystemExit('Discord delivery failed; check webhook configuration and rerun this job') from None
