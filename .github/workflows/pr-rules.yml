name: PR 규칙
on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, reopened, synchronize, ready_for_review]
permissions: {}
concurrency:
  group: pr-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  format:
    name: 브랜치 · PR 제목 형식
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: PR 제목 및 대상 확인
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.base_ref }}
          BRANCH: ${{ github.head_ref }}
          REPO: ${{ github.event.repository.name }}
        shell: python
        run: |
          import os, re, sys
          title = os.environ['TITLE']
          pattern = r'(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|infra)(\([^\s():]+\))?!?: [^\s].*'
          if not re.fullmatch(pattern, title, flags=re.IGNORECASE) or title != title.strip():
              sys.exit('PR 제목 예시: feat: 자전거 대여 추가 / fix(auth): 만료 처리 수정')
          if os.environ['REPO'] != '.github' and os.environ['BASE'] == 'main' and os.environ['BRANCH'] != 'develop':
              sys.exit('서비스의 main 반영은 develop → main PR로 진행합니다')
          print('PR 제목과 대상 브랜치 확인 완료')
